services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neural-gateway-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=NeuralGateway
      - APP_ENV=production
      - HOST=0.0.0.0
      - PORT=8000
      - WORKERS=4
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_AUDIT=llm-gateway-audit
      - RATE_LIMIT_TOKENS_PER_SECOND=100.0
      - RATE_LIMIT_BURST_CAPACITY=200.0
      - SEMANTIC_CACHE_ENABLED=true
      - SEMANTIC_CACHE_SIMILARITY_THRESHOLD=0.92
      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=4
      - CIRCUIT_BREAKER_RECOVERY_TIMEOUT=15.0
      - EWMA_DECAY_ALPHA=0.25
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').getcode() == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - neural-net

  redis:
    image: redis:7.2-alpine
    container_name: neural-gateway-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - neural-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: neural-gateway-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neural-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: neural-gateway-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 48
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 20s
    networks:
      - neural-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: neural-gateway-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - neural-net

volumes:
  redis-data:
  prometheus-data:

networks:
  neural-net:
    driver: bridge
