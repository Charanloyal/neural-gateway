services:
  - type: web
    name: neural-gateway-core
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: APP_ENV
        value: production
      - key: WORKERS
        value: "1"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: SEMANTIC_CACHE_ENABLED
        value: "true"
      - key: SEMANTIC_CACHE_SIMILARITY_THRESHOLD
        value: "0.88"


